<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>S3 Uploader</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 3rem auto; }
    #app { display: none; }
    li { margin: 0.3rem 0; }
    #status, #loginStatus { margin-top: 1rem; color: #444; }
    button { margin-left: 0.5rem; }
  </style>
</head>
<body>
  <h1>S3 Uploader</h1>

  <div id="login">
    <input id="username" placeholder="username" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <p id="loginStatus"></p>
  </div>

  <div id="app">
    <p>Logged in as <b id="who"></b> <button id="logoutBtn">Log out</button></p>
    <input type="file" id="file">
    <button id="uploadBtn">Upload</button>
    <p id="status"></p>
    <h3>Your files</h3>
    <ul id="files"></ul>
  </div>

  <script>
    const API = location.protocol === 'file:'
      ? 'https://ucrxy4p3fg.execute-api.eu-central-1.amazonaws.com/Prod'
      : location.origin + '/Prod'
    let authHeader = null
    const $ = (id) => document.getElementById(id)

    const api = async (path) => {
      const res = await fetch(API + path, { headers: { Authorization: authHeader } })
      if (res.status === 401) throw new Error('Invalid username or password')
      if (!res.ok) throw new Error('API error ' + res.status)
      return res.json()
    }

    const refreshList = async () => {
      const { files } = await api('/list')
      $('files').innerHTML = files.length
        ? files.map(f => `<li><a href="${f.url}" target="_blank">${f.name}</a> (${(f.size/1024).toFixed(1)} KB)</li>`).join('')
        : '<li><i>No files yet</i></li>'
    }

    $('loginBtn').onclick = async () => {
      authHeader = 'Basic ' + btoa($('username').value + ':' + $('password').value)
      $('loginStatus').textContent = 'Logging in...'
      try {
        const { user } = await api('/list')
        $('who').textContent = user
        $('login').style.display = 'none'
        $('app').style.display = 'block'
        await refreshList()
      } catch (e) {
        authHeader = null
        $('loginStatus').textContent = e.message
      }
    }

    $('logoutBtn').onclick = () => {
      authHeader = null
      $('password').value = ''
      $('app').style.display = 'none'
      $('login').style.display = 'block'
      $('loginStatus').textContent = ''
    }

    $('uploadBtn').onclick = async () => {
      const file = $('file').files[0]
      if (!file) return $('status').textContent = 'Pick a file first.'
      try {
        $('status').textContent = 'Requesting upload URL...'
        const type = file.type || 'application/octet-stream'
        const { uploadURL } = await api(`/upload-url?name=${encodeURIComponent(file.name)}&type=${encodeURIComponent(type)}`)
        $('status').textContent = 'Uploading...'
        const res = await fetch(uploadURL, { method: 'PUT', headers: { 'Content-Type': type }, body: file })
        if (!res.ok) throw new Error('Upload failed: HTTP ' + res.status)
        $('status').textContent = 'Uploaded ' + file.name
        await refreshList()
      } catch (e) {
        $('status').textContent = e.message
      }
    }
  </script>
</body>
</html>
