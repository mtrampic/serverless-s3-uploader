AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless S3 Uploader - per-user authenticated uploads using pre-signed URLs.

Globals:
  Api:
    EndpointConfiguration: EDGE
    Cors:
      AllowMethods: "'OPTIONS,GET'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
  Function:
    Timeout: 10

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
            - "*"
          AllowedMethods:
            - GET
            - PUT
            - POST
            - DELETE
            - HEAD
          AllowedOrigins:
            - "*"

  UsersTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: username
        Type: String

  S3UploaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3UploaderFunction/
      Handler: app.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          UploadBucket: !Ref S3Bucket
          UsersTable: !Ref UsersTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        Home:
          Type: Api
          Properties:
            Path: '/'
            Method: get
        ListFiles:
          Type: Api
          Properties:
            Path: '/list'
            Method: get
        UploadUrl:
          Type: Api
          Properties:
            Path: '/upload-url'
            Method: get

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UsersTableName:
    Description: DynamoDB users table
    Value: !Ref UsersTable
  S3BucketName:
    Description: S3 bucket
    Value: !Ref S3Bucket
